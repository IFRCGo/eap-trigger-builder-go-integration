steps:
  - name: 'gcr.io/cloud-builders/docker'
    env:
      - 'DOCKER_BUILDKIT=1'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/trigger-builder/frontend:${_IMAGE_TAG}'
      - '-f'
      - 'go-web-app/packages/trigger-builder-prototype/nginx-serve/Dockerfile'
      - '.'

images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/trigger-builder/frontend:${_IMAGE_TAG}'

timeout: '1200s'
